backend:
  name: github
  repo: rchoudhury2003/rajdeepchoudhurywebsite   # <-- change this
  branch: main
  base_url: https://rajdeep-cms-auth.choudhuryrajdeep24.workers.dev        # free login proxy, no Netlify hosting needed
  
media_folder: "content/images"
public_folder: "/content/images"

collections:
  - name: "posts"
    label: "Posts"
    folder: "public/content/posts"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Type", name: "type", widget: "select", options: ["photo", "film", "note", "music"] }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Text", name: "text", widget: "text" }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Video link (YouTube URL)", name: "video_url", widget: "string", required: false }
      - { label: "Link label", name: "link", widget: "string", required: false, default: "Watch on YouTube" }

  - name: "photos"
    label: "Gallery Photos"
    folder: "public/content/photos"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Place", name: "place", widget: "string" }
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Photo", name: "image", widget: "image" }

  - name: "photobooks"
    label: "Photobooks"
    folder: "public/content/photobooks"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title (place name)", name: "title", widget: "string" }
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Cover photo", name: "cover", widget: "image" }

  - name: "films"
    label: "Films"
    folder: "public/content/films"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "YouTube URL", name: "youtube_url", widget: "string" }
      - { label: "Thumbnail (optional)", name: "thumbnail", widget: "image", required: false }
      - { label: "Category", name: "category", widget: "select", options: ["travel", "piano"] }
      - { label: "Pin as 'Start here' featured film", name: "featured", widget: "boolean", default: false }
